# Publishes RepTrack to GitHub Pages.
#
# Requires: Settings → Pages → Source = "GitHub Actions", and a public
# repository (or a paid plan). RepTrack is static with no build step, so the
# repository root is the site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test tooling
        run: npm ci || npm install

      - name: Install a browser for the Playwright tests
        run: npx playwright install --with-deps chromium

      - name: Run the test suite
        run: npm test

      - name: Measure footprint
        run: npm run footprint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # No build step — the repository root is the site.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
